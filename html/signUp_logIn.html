            <div id = "auth-content"><!--This is where most of the content will be contained with occasoinal sidebars-->
                <div id = "auth-header">
                    <img src = "../images/green-omega-symbol.png" width = 100px height = 100px>
                    <h2>A hub of utilities.</h2>

                <!--Sing with email and password-->
                <form id = "auth-form"><!--I think I should use a new CSS font for this form at least for the placeholder textI think-->
                    
                    <div id = "username-email-container">
                        <label for = "username-email" class = "auth-form-label" >Username/Email<br></label>
                        <input type = "text" id = "username-email" name = "usernameOrEmail" placeholder = "Enter username or email...">
                    </div>

                    <div id = "password-container" class = "hidden">
                        <label for = "password" class = "auth-form-label">Password<br></label>
                        <input type = "password" id = "password" name = "password" placeholder = "Enter password">
                        <label for = "password" class = "auth-form-label" >Forgot your password?</label><!--Have to change the logic for the alternative code bcause firebase doesn't send and email-->
                    </div>

                    <div id = "vf-code-container" class = "hidden">
                        <input type = "text" id = "vf-code" name = "code" placeholder = "Enter code">
                        <label for = "vf-code" class = "auth-form-label"><br>Remembered your password?</label>
                    </div>
                    
                    <button type = "submit" id = "auth-continue">Continue</button>
                    <p id = "err-txt" style = "color:rgb(240, 142, 142)"></p>
