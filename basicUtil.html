        <!--This will be for the widget movment--> 
    <script>
        makeElementDraggable(document.getElementById("left-widget"));
        makeElementDraggable(document.getElementById("right-widget"));

        function makeElementDraggable(element) {
            if (!element) return;
            const header = element.querySelector(".widget-header");
            const dragHandle = header ? header : element;
            let startX = 0, startY = 0;
            let initialLeft = 0, initialTop = 0;
            dragHandle.addEventListener('mousedown', dragMouseDown);
            function dragMouseDown(e) {
                e.preventDefault();
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = element.offsetLeft;
                initialTop = element.offsetTop;
                element.style.right = "auto";
                element.style.left = initialLeft + "px";
                element.style.top = initialTop + "px";
                document.addEventListener('mousemove', elementDrag);
                document.addEventListener('mouseup', closeDragElement);
            }
            function elementDrag(e) {
                e.preventDefault();
                const deltaX = e.clientX - startX;
                const deltaY = e.clientY - startY;
                element.style.left = (initialLeft + deltaX) + "px";
                element.style.top = (initialTop + deltaY) + "px";
            }
            function closeDragElement() {
                document.removeEventListener('mousemove', elementDrag);
                document.removeEventListener('mouseup', closeDragElement);
            }// after years of work it WORKSSSS yipeeeeee
        }    
    </script>
